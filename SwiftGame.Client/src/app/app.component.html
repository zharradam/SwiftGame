@if (showAuthModal) {
  <app-auth-modal
    [initialMode]="authModalMode"
    (close)="showAuthModal = false"
    (authenticated)="showAuthModal = false" />
}

<div class="app-layout">

  <!-- Header -->
  <header class="app-header">
    <span class="app-header__title">🎵 {{ title }}</span>
    <div class="app-header__auth">
      @if (auth.isAuthenticated()) {
        <span class="user-chip">👤 {{ auth.username() }}</span>
        <button class="btn-ghost" (click)="auth.logout()">Log out</button>
      } @else {
        <button class="btn-ghost" (click)="openLogin()">Log in</button>
        <button class="btn-primary" (click)="openRegister()">Sign up</button>
      }
    </div>
  </header>

  <!-- One set of panels for every width. Phones show one at a time via data-tab; the game stays mounted. -->
  <div class="app-body" [attr.data-tab]="activeTab">
    <aside class="app-sidebar">
      <swiftgame-leaderboard />
    </aside>
    <main class="app-main">
      <swiftgame-game
        [hidden]="gameHidden"
        (openLogin)="openLogin()"
        (openRegister)="openRegister()" />
    </main>
    <aside class="app-chat">
      <swiftgame-chat (openLogin)="openLogin()" />
    </aside>
  </div>

  <!-- Phone tab bar -->
  <nav class="app-tabs" aria-label="Sections">
    <button class="app-tabs__tab" [class.active]="activeTab === 'game'" [attr.aria-current]="activeTab === 'game' ? 'page' : null" (click)="setTab('game')">
      <span class="app-tabs__icon" aria-hidden="true">🎵</span>
      <span class="app-tabs__label">Game</span>
    </button>
    <button class="app-tabs__tab" [class.active]="activeTab === 'leaderboard'" [attr.aria-current]="activeTab === 'leaderboard' ? 'page' : null" (click)="setTab('leaderboard')" aria-label="Leaderboard">
      <span class="app-tabs__icon" aria-hidden="true">🏆</span>
      <span class="app-tabs__label">Leaderboard</span>
    </button>
    <button class="app-tabs__tab" [class.active]="activeTab === 'chat'" [attr.aria-current]="activeTab === 'chat' ? 'page' : null" (click)="setTab('chat')">
      <span class="app-tabs__icon" aria-hidden="true">💬</span>
      <span class="app-tabs__label">Chat</span>
    </button>
  </nav>

</div>
